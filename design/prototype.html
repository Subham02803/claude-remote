<meta charset="utf-8">
<title>Claude Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #08090C;
    --app: #0E1014;
    --term: #0A0B0E;
    --surface: #16191F;
    --raised: #1C2027;
    --raised2: #23272F;
    --line: #2A2F38;
    --line-strong: #39404B;
    --ink: #E8EAED;
    --ink-2: #C9D0DA;
    --ink-3: #A8AFBA;
    --ink-4: #6E7681;
    --need: #F2A93B;
    --need-ink: #F5C889;
    --need-dim: #B08A52;
    --work: #46B8CC;
    --done: #4FBF87;
    --fail: #E5675E;
    --sans: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; font-size: 14px; }
  :focus-visible { outline: 2px solid var(--need); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-4); }
  .mono { font-family: var(--mono); }
  .num { font-variant-numeric: tabular-nums; }
  .row { display: flex; align-items: center; }
  .col { display: flex; flex-direction: column; }
  .spacer { flex-grow: 1; }
  .hr { height: 1px; background: var(--line); flex-shrink: 0; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  h1, h2 { margin: 0; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
  p { margin: 0; }
  .safe { height: 50px; flex-shrink: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* page chrome */
  .chrome { display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .chrome__name { font-family: var(--mono); font-size: 12.5px; letter-spacing: 0.04em; color: var(--ink-3); }
  .chrome__note { font-size: 12.5px; color: var(--ink-4); }
  .seg { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; }
  .seg button { font: inherit; font-size: 12.5px; padding: 7px 15px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-4); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--raised2); color: var(--ink); }
  .ghost-btn { font: inherit; font-size: 12.5px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 7px; background: transparent; color: var(--ink-3); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .ghost-btn:hover { border-color: var(--line-strong); color: var(--ink); }
  .stage { padding: 30px 22px 60px; overflow-x: auto; }
  .stage__inner { display: flex; justify-content: center; min-width: min-content; }
  .desk-frame { width: 1360px; height: 856px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--app); box-shadow: 0 30px 80px -30px rgba(0,0,0,0.9); }
  .phone-frame { width: 414px; height: 868px; padding: 12px; border-radius: 46px; background: #15171C; border: 1px solid var(--line-strong); box-shadow: 0 30px 80px -30px rgba(0,0,0,0.9); }
  .phone-frame > .app { border-radius: 34px; }
  .app { width: 100%; height: 100%; background: var(--app); position: relative; overflow: hidden; }

  /* atoms */
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 5px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
  .pill--need { background: rgba(242,169,59,0.14); color: var(--need); }
  .pill--work { background: rgba(70,184,204,0.12); color: var(--work); }
  .pill--done { background: rgba(79,191,135,0.12); color: var(--done); }
  .pill--fail { background: rgba(229,103,94,0.12); color: var(--fail); }
  .pill--stop { background: rgba(110,118,129,0.16); color: var(--ink-3); }
  .dot { width: 6px; height: 6px; border-radius: 999px; display: block; flex-shrink: 0; }
  .dot--pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }
  .cursor { display: inline-block; width: 8px; height: 15px; background: var(--need); vertical-align: -3px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

  .btn { font: inherit; border: 0; border-radius: 7px; background: var(--need); color: #12141A; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:disabled { background: var(--raised2); color: var(--ink-4); cursor: not-allowed; }
  .btn--line { background: transparent; border: 1px solid var(--line-strong); color: var(--ink-3); font-weight: 500; }
  .btn--line:hover:not(:disabled) { border-color: var(--ink-4); color: var(--ink); }
  .btn--deny { background: rgba(229,103,94,0.10); border: 1px solid rgba(229,103,94,0.5); color: var(--fail); font-weight: 600; }
  .btn--deny:hover { background: rgba(229,103,94,0.18); border-color: var(--fail); }
  .btn--sm { padding: 9px 16px; font-size: 13px; min-height: 40px; }
  .btn--md { padding: 11px 20px; font-size: 13.5px; min-height: 44px; }
  .btn--tall { height: 56px; font-size: 16px; width: 100%; }
  .btn--tall-line { height: 48px; font-size: 14px; width: 100%; }
  .chip { font: inherit; font-size: 12.5px; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink-3); cursor: pointer; white-space: nowrap; min-height: 44px; }
  .chip:hover { border-color: var(--line-strong); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--raised2); border-color: var(--line-strong); color: var(--ink); }
  .icon-btn { width: 44px; height: 44px; border-radius: 9px; border: 1px solid var(--line); background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-3); flex-shrink: 0; }
  .icon-btn:hover { border-color: var(--line-strong); color: var(--ink); }
  .icon-btn--plain { border-color: transparent; }
  .icon-btn--danger { border-color: rgba(229,103,94,0.4); color: var(--fail); }
  .icon-btn--on { border-color: rgba(242,169,59,0.5); color: var(--need); }
  .link-btn { background: none; border: 0; padding: 10px 2px; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--need); cursor: pointer; min-height: 44px; }
  .link-btn--quiet { color: var(--ink-4); font-weight: 400; }
  .link-btn--quiet:hover { color: var(--ink-3); }

  .topbar { height: 56px; flex-shrink: 0; background: #12141A; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 14px; }
  .brand { display: flex; align-items: center; gap: 9px; cursor: pointer; background: none; border: 0; padding: 6px; color: var(--ink); }
  .brand__word { font-family: var(--mono); font-size: 13px; font-weight: 600; }
  .brand__word i { color: var(--ink-4); font-style: normal; }
  .host { display: flex; align-items: center; gap: 8px; padding: 7px 11px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
  .host--warn { border-color: rgba(70,184,204,0.4); color: var(--work); }
  .host--cold { border-color: rgba(110,118,129,0.4); color: var(--ink-4); }

  .banner { flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid; animation: rise 0.24s ease-out; }
  .banner--need { background: rgba(242,169,59,0.09); border-color: rgba(242,169,59,0.28); }
  .banner--calm { background: rgba(79,191,135,0.07); border-color: rgba(79,191,135,0.24); }
  .banner--link { background: rgba(70,184,204,0.09); border-color: rgba(70,184,204,0.3); }
  @keyframes rise { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }
  .where { font-family: var(--mono); font-size: 11.5px; color: var(--need-dim); }
  .where b { color: var(--need-ink); font-weight: 500; }

  /* stale content while catching up */
  .stale { opacity: 0.45; filter: saturate(0.6); pointer-events: none; }

  /* project rail */
  .rail { width: 268px; flex-shrink: 0; background: #12141A; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px; gap: 4px; overflow-y: auto; }
  .proj { display: flex; align-items: center; gap: 8px; padding: 10px 9px; border-radius: 6px; border: 0; background: transparent; color: var(--ink-3); font-family: var(--mono); font-size: 12.5px; cursor: pointer; text-align: left; width: 100%; min-height: 40px; }
  .proj:hover { background: rgba(255,255,255,0.03); }
  .proj[aria-pressed="true"] { background: var(--raised); color: var(--ink); }
  .proj__name { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; }
  .proj__count { font-size: 10.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
  .sess-link { display: flex; align-items: center; gap: 8px; padding: 8px 9px 8px 30px; border-radius: 6px; border: 0; background: transparent; color: var(--ink-4); font-size: 12px; cursor: pointer; text-align: left; width: 100%; min-height: 38px; }
  .sess-link:hover { background: rgba(255,255,255,0.03); color: var(--ink-3); }
  .sess-link[aria-current="true"] { background: var(--raised); color: var(--ink); }
  .sess-link__name { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .caretx { width: 12px; flex-shrink: 0; color: var(--ink-4); display: inline-flex; }

  /* session cards */
  .group__head { display: flex; align-items: center; gap: 10px; padding-bottom: 2px; }
  .group__name { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
  .group__path { font-family: var(--mono); font-size: 11px; color: var(--ink-4); }
  .card { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; text-align: left; padding: 0; font: inherit; color: inherit; cursor: pointer; width: 100%; }
  .card:hover { border-color: var(--line-strong); }
  .card--need { background: #191B21; border-color: rgba(242,169,59,0.35); }
  .card__rail { width: 3px; flex-shrink: 0; }
  .card__body { flex-grow: 1; min-width: 0; padding: 13px 15px; display: flex; flex-direction: column; gap: 8px; }
  .card__head { display: flex; align-items: center; gap: 10px; }
  .card__title { font-size: 14px; font-weight: 500; }
  .card__meta { font-family: var(--mono); font-size: 11.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
  .card__line { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); min-width: 0; }

  /* tabs */
  .tabs { display: flex; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--line); flex-shrink: 0; background: #101216; }
  .tab { font: inherit; font-size: 13px; padding: 12px 14px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--ink-4); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; min-height: 48px; }
  .tab:hover { color: var(--ink-3); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--need); }
  .tab__badge { font-family: var(--mono); font-size: 10px; padding: 2px 6px; border-radius: 999px; background: var(--raised2); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .tab__badge--need { background: rgba(242,169,59,0.18); color: var(--need); }
  .tab__badge--work { background: rgba(70,184,204,0.16); color: var(--work); }
  /* Phone: four tabs share the width exactly rather than scrolling off-screen. */
  .tabs--phone { padding: 0 6px; }
  .tabs--phone .tab { flex: 1 1 0; min-width: 0; padding: 12px 4px; font-size: 12.5px; gap: 5px; }

  /* terminal */
  .term { flex-grow: 1; min-height: 0; overflow-y: auto; background: var(--term); font-family: var(--mono); font-size: 12.5px; line-height: 1.8; padding: 16px 20px 20px; }
  .term__hello { color: var(--ink-4); }
  .term__box { border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px 12px; margin: 8px 0 16px; color: var(--ink); display: flex; gap: 10px; }
  .term__box i { color: var(--need); font-style: normal; }
  .term__say { color: var(--ink-2); display: flex; gap: 10px; margin: 10px 0; }
  .term__say b { color: var(--ink-4); font-weight: 400; flex-shrink: 0; }
  .term__tool { display: flex; gap: 10px; margin-top: 10px; }
  .term__tool b { color: var(--ink-4); font-weight: 400; flex-shrink: 0; }
  .term__name { color: var(--ink); }
  .term__arg { color: var(--work); }
  .term__out { padding-left: 26px; color: var(--ink-4); }
  .term__out i { font-style: normal; color: var(--ink-4); }
  .term__ok { color: var(--done); }
  .term__warn { color: var(--need); }
  .term__err { color: var(--fail); }
  .term__wait { display: flex; gap: 10px; margin: 14px 0; padding: 10px 12px; border: 1px solid rgba(242,169,59,0.35); border-radius: 6px; background: rgba(242,169,59,0.07); color: var(--need-ink); align-items: center; flex-wrap: wrap; }
  .term__gap { display: flex; align-items: center; gap: 10px; margin: 16px 0; color: var(--work); font-size: 11px; }
  .term__gap span.hr { background: rgba(70,184,204,0.3); flex-grow: 1; }

  /* prompt input */
  .promptbar { flex-shrink: 0; border-top: 1px solid var(--line); background: #101216; padding: 12px 20px 14px; display: flex; flex-direction: column; gap: 10px; }
  .promptbox { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--term); padding: 10px 12px; }
  .promptbox > i { color: var(--need); font-style: normal; font-family: var(--mono); font-size: 13px; line-height: 1.6; }
  textarea.tinput { font-family: var(--mono); font-size: 13px; line-height: 1.6; color: var(--ink); background: transparent; border: 0; resize: none; width: 100%; padding: 0; }
  textarea.tinput::placeholder { color: var(--ink-4); }
  textarea.tinput:focus { outline: none; }
  textarea.tinput:disabled { color: var(--ink-4); }
  .queue { display: flex; flex-direction: column; gap: 5px; }
  .queue__row { display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; min-height: 44px; }
  .queue__n { font-family: var(--mono); font-size: 10.5px; color: var(--need); width: 14px; flex-shrink: 0; }
  .queue__text { font-size: 12.5px; color: var(--ink-2); flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .queue__x { width: 44px; height: 36px; border-radius: 6px; border: 0; background: transparent; color: var(--ink-4); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .queue__x:hover { background: var(--raised2); color: var(--ink); }

  /* agents */
  .agent { display: flex; align-items: center; gap: 11px; padding: 11px 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; }
  .agent--sub { margin-left: 26px; }
  .agent__name { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
  .agent__doing { font-family: var(--mono); font-size: 11.5px; color: var(--ink-4); }

  /* changes + diff */
  .file { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .file__head { display: flex; align-items: center; gap: 10px; padding: 11px 12px; background: transparent; border: 0; width: 100%; cursor: pointer; font: inherit; color: inherit; text-align: left; min-height: 44px; }
  .file__head:hover { background: rgba(255,255,255,0.025); }
  .file__caret { color: var(--ink-4); display: inline-flex; flex-shrink: 0; }
  .diff { border-top: 1px solid var(--line); background: var(--term); font-family: var(--mono); font-size: 11.5px; line-height: 1.75; overflow-x: auto; padding: 8px 0; }
  .diff__line { display: flex; gap: 10px; padding: 0 12px; white-space: pre; }
  .diff__n { color: var(--ink-4); width: 30px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .diff__s { flex-grow: 1; }
  .diff__line--add { background: rgba(79,191,135,0.09); }
  .diff__line--add .diff__s { color: var(--done); }
  .diff__line--del { background: rgba(229,103,94,0.09); }
  .diff__line--del .diff__s { color: var(--fail); }
  .diff__line--ctx .diff__s { color: var(--ink-3); }

  /* file preview — the rendered side of Changes. A diff answers "what changed";
     a preview answers "does it look right", which is the only question you can
     actually settle from a phone. */
  .pv__bar { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--raised); flex-wrap: wrap; }
  .pv__seg { display: flex; gap: 3px; padding: 3px; background: var(--app); border: 1px solid var(--line); border-radius: 7px; flex-shrink: 0; }
  .pv__seg button { font: inherit; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 12px; border: 0; border-radius: 5px; background: transparent; color: var(--ink-4); cursor: pointer; min-height: 32px; }
  .pv__seg button[aria-pressed="true"] { background: var(--raised2); color: var(--ink); }
  .pv__note { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-4); }
  .pv { border-top: 1px solid var(--line); background: var(--term); max-height: 430px; overflow-y: auto; padding: 20px 22px; }
  .pv--phone { max-height: 320px; padding: 15px 16px; }
  .kind { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; background: var(--raised2); color: var(--ink-4); flex-shrink: 0; }

  /* file browser + full-screen sheet, matching apps/web/src/styles.css */
  .crumb { font: inherit; font-family: var(--mono); font-size: 12px; padding: 4px 7px; border: 0; border-radius: 5px; background: transparent; color: var(--ink-3); cursor: pointer; }
  .crumb:hover { background: var(--raised2); color: var(--ink); }
  .entry { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; background: transparent; border: 1px solid transparent; border-radius: 7px; cursor: pointer; font: inherit; color: var(--ink-3); text-align: left; min-height: 40px; }
  .entry:hover, .entry--open { background: var(--surface); border-color: var(--line); }
  .entry__icon { width: 12px; flex-shrink: 0; color: var(--ink-4); font-size: 11px; text-align: center; }
  .pv__code { margin: 0; font-family: var(--mono); font-size: 11.5px; line-height: 1.75; color: var(--ink-2); white-space: pre; }
  .pv--full { max-height: none; height: 100%; padding: 0; border-top: 0; }
  .pv__frame--full { height: 100%; border: 0; border-radius: 0; }
  .pv__sheet { position: absolute; inset: 0; z-index: 60; background: var(--app); display: flex; flex-direction: column; }
  .pv__sheet-bar { flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--raised); }
  .pv__sheet-body { flex-grow: 1; min-height: 0; overflow: auto; }
  .pv__sheet-body .md { padding: 24px; max-width: 74ch; margin: 0 auto; }
  .pv__sheet-body .pv__code { padding: 20px; }
  .md__inline { font-family: var(--mono); font-size: 0.92em; padding: 1px 5px; border-radius: 4px; background: var(--raised2); color: var(--ink-2); }

  /* rendered markdown */
  .md { display: flex; flex-direction: column; gap: 11px; max-width: 62ch; }
  .md__h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
  .md__h2 { font-size: 14.5px; font-weight: 600; color: var(--ink-2); margin-top: 4px; }
  .md__p { font-size: 13.5px; line-height: 1.65; color: var(--ink-3); }
  .md__li { font-size: 13.5px; line-height: 1.65; color: var(--ink-3); padding-left: 18px; position: relative; }
  .md__li::before { content: "—"; position: absolute; left: 0; color: var(--ink-4); }
  .md__quote { border-left: 2px solid var(--line-strong); padding-left: 12px; font-size: 13px; line-height: 1.6; color: var(--ink-4); }
  .md__code { background: var(--app); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-family: var(--mono); font-size: 11.5px; line-height: 1.7; color: var(--ink-2); overflow-x: auto; white-space: pre; }
  .md__hr { height: 1px; background: var(--line); }

  /* sandboxed html preview */
  .pv__frame { width: 100%; height: 390px; border: 1px solid var(--line); border-radius: 7px; background: #fff; display: block; }
  .pv__frame--phone { height: 300px; }

  /* misc */
  .ask { background: var(--term); border: 1px solid var(--line-strong); border-radius: 8px; padding: 13px 14px; display: flex; flex-direction: column; gap: 9px; }
  .ask__cmd { font-family: var(--mono); font-size: 14px; color: var(--ink); line-height: 1.5; word-break: break-word; }
  .ask__why { font-size: 13px; color: var(--ink-3); line-height: 1.55; }

        + '<button class="btn btn--md" style="min-width:150px" data-act="approve" data-arg="' + s.id + '">Approve once</button>'
        + '<button class="btn btn--deny btn--md" style="min-width:150px" data-act="deny" data-arg="' + s.id + '">Deny</button></div>';

    return '<div role="tabpanel" aria-label="Waiting for you" style="flex-grow:1;overflow-y:auto;padding:' + (phone ? '16px 18px 20px' : '22px 24px') + ';display:flex;flex-direction:column;gap:14px;max-width:' + (phone ? 'none' : '760px') + '">'
      + '<div class="row" style="gap:9px;padding:10px 13px;background:rgba(242,169,59,0.09);border:1px solid rgba(242,169,59,0.3);border-radius:9px">'
      + I.warn + '<span class="label" style="color:var(--need)">Waiting on you</span><span class="spacer"></span>'
      + '<span class="mono num" style="font-size:11.5px;color:var(--need-dim)">blocked ' + esc(s.blockedFor || s.elapsed) + '</span></div>'
      + '<h2 style="font-size:' + (phone ? '22' : '24') + 'px">' + esc(s.ask.title) + '</h2>'
      + '<div class="ask"><span class="label">in ' + esc(s.ask.cwd) + '</span>'
      + '<span class="ask__cmd">' + esc(s.ask.cmd) + '</span></div>'
      + '<p class="ask__why">&ldquo;' + esc(s.ask.why) + '&rdquo;</p>'
      + '<div class="col" style="gap:9px"><span class="label">What it touches</span>' + touches + '</div>'
      + (phone ? '<span class="spacer" style="min-height:10px"></span>' : '')
      + buttons
      + '<span class="mono" style="font-size:10.5px;color:var(--ink-4)">Denying is safe — Claude picks another route and keeps going.</span>'
      + '<span class="hr"></span>'
      + '<button class="link-btn link-btn--quiet" style="align-self:flex-start" data-act="askApproveAll" data-arg="' + s.id + '">'
      + 'Stop asking me for this session&hellip;</button>'
      + '</div>';
  }

  /* The blanket grant, stated in the words of what it actually gives up. */
  function approveAllModal(phone) {
    var s = locate(state.modal.replace('approveAll:', '')).s;
    return '<div class="scrim" style="align-items:' + (phone ? 'flex-end' : 'center') + ';justify-content:center">'
      + '<div class="modal" style="' + (phone ? 'border-radius:20px 20px 0 0;width:100%' : 'width:520px') + '">'
      + '<div class="row" style="gap:11px">' + I.warn
      + '<h2 style="font-size:18px">Pre-approve everything in this session?</h2></div>'
      + '<p style="font-size:13.5px;line-height:1.6;color:var(--ink-3)">Claude will run every command and write every file in <span class="mono" style="color:var(--ink)">'
      + esc(s.name) + '</span> without asking again — including anything it decides to do next, which neither of us has seen yet.</p>'
      + '<p style="font-size:13.5px;line-height:1.6;color:var(--ink-3)">This lasts until the session ends or you stop it.</p>'
      + '<div class="row" style="gap:9px;flex-wrap:wrap"><span class="spacer"></span>'
      + '<button class="btn btn--line btn--md" data-act="closeModal">Keep asking me</button>'
      + '<button class="btn btn--deny btn--md" data-act="approveAll" data-arg="' + s.id + '">Pre-approve everything</button></div></div></div>';
  }

  /* ---------- agents tab ---------- */

  function agentsTab(s, phone) {
    var rows = '';
    s.agents.forEach(function (a) {
      var c = a.status === 'working' ? 'var(--work)' : a.status === 'blocked' ? 'var(--need)'
        : a.status === 'done' ? 'var(--done)' : a.status === 'stopped' ? 'var(--ink-4)' : 'var(--fail)';
      rows += '<div class="agent' + (a.sub ? ' agent--sub' : '') + '">'
        + '<span class="dot' + ((a.status === 'working' || a.status === 'blocked') && !frozen() ? ' dot--pulse' : '') + '" style="background:' + c + '"></span>'
        + '<span class="col" style="gap:3px;min-width:0;flex-grow:1">'
        + '<span class="row" style="gap:8px"><span class="agent__name">' + esc(a.name) + '</span>'
        + '<span class="label" style="font-size:9px">' + (a.sub ? 'subagent' : 'session') + '</span>'
        + '</span>'
        + '<span class="agent__doing truncate">' + esc(a.doing) + '</span></span>'
        + '<span class="mono num" style="font-size:11px;color:' + c + '">' + esc(a.elapsed) + '</span>'
        + '</div>';
    });
    var busy = busyAgents(s);
    return '<div role="tabpanel" aria-label="Agents" style="flex-grow:1;overflow-y:auto;padding:' + (phone ? '16px 18px' : '22px 24px') + ';display:flex;flex-direction:column;gap:14px">'
      + '<div class="row" style="gap:10px"><span class="label">Who is working on this session</span><span class="spacer"></span>'
      + '<span class="mono num" style="font-size:11.5px;color:' + (busy ? 'var(--work)' : 'var(--ink-4)') + '">' + busy + ' of ' + s.agents.length + ' active</span></div>'
      + '<div class="col" style="gap:6px;max-width:' + (phone ? 'none' : '720px') + '">' + rows + '</div>'
      + '<span class="mono" style="font-size:10.5px;color:var(--ink-4);line-height:1.6;max-width:60ch">Subagents run in parallel and report back to the session. Stopping the session stops all of them.</span>'
      + '</div>';
  }

  /* ---------- changes tab ---------- */

  /* Renders one previewable file's body. Markdown is turned into elements here
     rather than shipped as HTML, so nothing a session wrote can style or script
     this app. An .html prototype is the opposite case — it has to run as itself,
     so it goes in an iframe with `allow-scripts` but WITHOUT `allow-same-origin`.
     That pair is load-bearing: scripts work, and the frame still lands in an
     opaque origin with no reach into the parent. Since the tailnet is the only
     gate this app has, a prototype that could touch the parent could drive
     /api/sessions. */
  function previewNote(f) {
    if (f.kind === 'html') { return 'Sandboxed · cannot reach this app'; }
    if (f.kind === 'md') { return 'Rendered read-only'; }
    return 'Shown as plain text';
  }

  /* Markdown becomes elements; an .html file goes in a frame with
     allow-scripts and WITHOUT allow-same-origin, so it runs as itself in an
     opaque origin with no reach into the parent. */
  function previewBody(f, phone, full) {
    var cls = 'pv' + (phone ? ' pv--phone' : '') + (full ? ' pv--full' : '');
    if (f.kind === 'html') {
      return '<div class="' + cls + '"><iframe class="pv__frame' + (full ? ' pv__frame--full' : (phone ? ' pv__frame--phone' : ''))
        + '" sandbox="allow-scripts" referrerpolicy="no-referrer" title="Preview" srcdoc="' + esc(f.preview) + '"></iframe></div>';
    }
    if (f.kind === 'md') {
      var out = '';
      (f.preview || []).forEach(function (b) {
        if (b.t === 'hr') { out += '<div class="md__hr"></div>'; return; }
        out += '<div class="md__' + b.t + '">' + esc(b.s) + '</div>';
      });
      return '<div class="' + cls + '"><div class="md">' + out + '</div></div>';
    }
    return '<div class="' + cls + '"><pre class="pv__code">' + esc(f.preview) + '</pre></div>';
  }

  function previewBar(f) {
    if (!f) { return ''; }
    return '<div class="pv__bar">'
      + '<span class="kind">' + esc(f.kind) + '</span>'
      + '<span class="pv__note">' + (f.kind === 'html' ? I.shield : '') + previewNote(f) + '</span>'
      + '<span class="spacer"></span>'
      + '<button class="btn btn--line btn--sm" data-act="openFull" data-arg="' + esc(state.openTree) + '">Full screen</button>'
      + '<button class="btn btn--line btn--sm" data-act="treeOpen" data-arg="' + esc(state.openTree) + '">Collapse</button>'
      + '</div>';
  }

  /* Changes answers "what did this session do", so it shows the edit, never the
     file as it stands now. Reading a whole file is the Preview tab's job. */
  function changesTab(s, phone) {
    if (!s.files.length) {
      return '<div role="tabpanel" aria-label="Changes" style="flex-grow:1;padding:24px"><div class="empty">'
        + '<span style="font-size:14px;color:var(--ink-3)">Nothing changed in this session</span>'
        + '<span style="font-size:12.5px;color:var(--ink-4)">No files were written.</span></div></div>';
    }
    var rows = '';
    s.files.forEach(function (f) {
      var open = state.openFile === f.path;
      var lines = '';
      if (open && f.diff) {
        f.diff.forEach(function (d) {
          var sign = d.t === 'add' ? '+' : d.t === 'del' ? '-' : ' ';
          lines += '<div class="diff__line diff__line--' + d.t + '">'
            + '<span class="diff__n">' + esc(d.n) + '</span>'
            + '<span class="diff__s">' + esc(sign + ' ' + d.s) + '</span></div>';
        });
      }
      rows += '<div class="file">'
        + '<button class="file__head" data-act="toggleFile" data-arg="' + esc(f.path) + '" aria-expanded="' + open + '">'
        + '<span class="file__caret">' + (open ? I.chevD : I.chev) + '</span>'
        + '<span class="mono truncate" style="font-size:12px;flex-grow:1">' + esc(f.path) + '</span>'
        + (f.add ? '<span class="mono num" style="font-size:11px;color:var(--done)">' + esc(f.add) + '</span>' : '')
        + (f.del ? '<span class="mono num" style="font-size:11px;color:var(--fail)">' + esc(f.del) + '</span>' : '')
        + '</button>'
        + (open ? '<div class="diff">' + lines + '</div>' : '')
        + '</div>';
    });
    return '<div role="tabpanel" aria-label="Changes" style="flex-grow:1;overflow-y:auto;padding:' + (phone ? '16px 18px' : '22px 24px') + ';display:flex;flex-direction:column;gap:12px">'
      + '<div class="row" style="gap:10px"><span class="label">Files this session touched</span><span class="spacer"></span>'
      + '<span class="mono num" style="font-size:11.5px;color:var(--ink-4)">' + s.files.length + ' files · tap to see the edits</span></div>'
      + '<div class="col" style="gap:6px;max-width:' + (phone ? 'none' : '760px') + '">' + rows + '</div></div>';
  }

  /* ---------- Preview: the project, not the session ---------- */

  function crumbs() {
    var out = '<button class="crumb" data-act="treeGo" data-arg="">project</button>';
    var parts = state.tree ? state.tree.split('/') : [];
    var at = '';
    parts.forEach(function (part) {
      at = at ? at + '/' + part : part;
      out += '<span style="color:var(--ink-4)">/</span>'
        + '<button class="crumb" data-act="treeGo" data-arg="' + esc(at) + '">' + esc(part) + '</button>';
    });
    return out;
  }

  function filesTab(s, phone) {
    var entries = TREE[state.tree] || [];
    var rows = '';
    if (state.tree) {
      var up = state.tree.split('/').slice(0, -1).join('/');
      rows += '<button class="entry" data-act="treeGo" data-arg="' + esc(up) + '">'
        + '<span class="entry__icon">&#8593;</span>'
        + '<span class="mono" style="font-size:12.5px;flex-grow:1">..</span></button>';
    }
    entries.forEach(function (e) {
      var path = state.tree ? state.tree + '/' + e.n : e.n;
      var open = !e.d && state.openTree === path;
      rows += '<button class="entry' + (open ? ' entry--open' : '') + '"'
        + ' data-act="' + (e.d ? 'treeGo' : 'treeOpen') + '" data-arg="' + esc(path) + '">'
        + '<span class="entry__icon">' + (e.d ? '&#9656;' : '&middot;') + '</span>'
        + '<span class="mono truncate" style="font-size:12.5px;flex-grow:1' + (e.d ? ';color:var(--ink-2)' : '') + '">' + esc(e.n) + '</span>'
        + (e.k && e.k !== 'text' ? '<span class="kind">' + esc(e.k) + '</span>' : '')
        + (e.b ? '<span class="mono num" style="font-size:11px;color:var(--ink-4)">' + esc(e.b) + '</span>' : '')
        + '</button>';
      if (open) {
        var f = FILES[path];
        rows += '<div class="file" style="margin-top:4px">'
          + previewBar(f)
          + (f ? previewBody(f, phone) : '<div class="pv"><span style="font-size:12.5px;color:var(--ink-4)">Nothing to show for this one.</span></div>')
          + '</div>';
      }
    });

    return '<div role="tabpanel" aria-label="Preview" style="flex-grow:1;overflow-y:auto;padding:' + (phone ? '16px 18px' : '22px 24px') + ';display:flex;flex-direction:column;gap:12px">'
      + '<div class="row" style="gap:8px;flex-wrap:wrap">' + crumbs() + '<span class="spacer"></span>'
      + '<span class="mono num" style="font-size:11.5px;color:var(--ink-4)">' + entries.length + ' items</span></div>'
      + '<div class="col" style="gap:4px;max-width:' + (phone ? 'none' : '760px') + '">' + rows + '</div></div>';
  }

  function fullSheet(phone) {
    if (!state.full) { return ''; }
    var f = FILES[state.full];
    if (!f) { return ''; }
    return '<div class="pv__sheet">'
      + '<div class="pv__sheet-bar">'
      + '<span class="kind">' + esc(f.kind) + '</span>'
      + '<span class="mono truncate" style="font-size:12px;flex-grow:1;min-width:0">' + esc(state.full) + '</span>'
      + (phone ? '' : '<span class="pv__note">' + previewNote(f) + '</span>')
      + '<button class="btn btn--line btn--sm" data-act="closeFull">Close</button>'
      + '</div>'
      + '<div class="pv__sheet-body">' + previewBody(f, phone, true) + '</div></div>';
  }

  function tabsBar(s, phone) {
    var pend = s.ask ? 1 : 0;
    var busy = busyAgents(s);
    // Phone gets shorter labels and equal-width tabs so all four fit on screen.
    var def = [
      ['terminal', 'Terminal', 'Terminal', s.queue.length ? '<span class="tab__badge">' + (phone ? '+' + s.queue.length : '+' + s.queue.length + ' queued') + '</span>' : ''],
      ['waiting', 'Waiting for you', 'Waiting', pend ? '<span class="tab__badge tab__badge--need">1</span>' : ''],
      ['agents', 'Agents', 'Agents', busy ? '<span class="tab__badge tab__badge--work">' + busy + '</span>' : '<span class="tab__badge">' + s.agents.length + '</span>'],
      ['changes', 'Changes', 'Changes', s.files.length ? '<span class="tab__badge">' + s.files.length + '</span>' : ''],
      ['files', 'Preview', 'Preview', '']
    ];
    var out = '<div class="tabs' + (phone ? ' tabs--phone' : '') + '" role="tablist" aria-label="Session views">';
    def.forEach(function (d) {
      out += '<button class="tab" role="tab" aria-selected="' + (state.tab === d[0]) + '"'
        + ' data-act="tab" data-arg="' + d[0] + '">' + (phone ? d[2] : d[1]) + d[3] + '</button>';
    });
    return out + '</div>';
  }

  function tabBody(s, phone) {
    if (state.tab === 'waiting') { return waitingTab(s, phone); }
    if (state.tab === 'agents') { return agentsTab(s, phone); }
    if (state.tab === 'changes') { return changesTab(s, phone); }
    if (state.tab === 'files') { return filesTab(s, phone); }
    return terminal(s, phone);
  }

  /* ---------- workspace (projects + sessions) ---------- */

  function railHtml() {
    var out = '<div class="rail">'
      + '<span class="label" style="padding:0 9px 6px">Projects</span>'
      + '<button class="proj" data-act="scope" data-arg="all" aria-pressed="' + (state.scope === 'all') + '">'
      + '<span class="caretx"></span><span class="proj__name">all projects</span>'
      + '<span class="proj__count">' + allSessions().length + '</span></button>';
    state.projects.forEach(function (p) {
      var open = !!state.expanded[p.id];
      var w = p.sessions.filter(function (s) { return s.status === 'waiting'; }).length;
      var busy = p.sessions.filter(function (s) { return s.status === 'working'; }).length;
      var c = w ? 'var(--need)' : busy ? 'var(--work)' : p.sessions.length ? 'var(--line-strong)' : 'var(--line)';
      out += '<button class="proj" data-act="toggleProj" data-arg="' + p.id + '" aria-pressed="' + (state.scope === p.id) + '"'
        + ' aria-expanded="' + open + '">'
        + '<span class="caretx">' + (p.sessions.length ? (open ? I.chevD : I.chev) : '') + '</span>'
        + '<span class="dot" style="width:7px;height:7px;background:' + c + '"></span>'
        + '<span class="proj__name">' + esc(p.name) + '</span>'
        + '<span class="proj__count">' + (p.sessions.length || '') + '</span></button>';
      if (open) {
        p.sessions.forEach(function (s) {
          out += '<button class="sess-link" data-act="open" data-arg="' + s.id + '" aria-current="' + (state.screen === 'session' && state.openId === s.id) + '">'
            + '<span class="dot' + ((s.status === 'working' || s.status === 'waiting') && !frozen() ? ' dot--pulse' : '') + '" style="width:5px;height:5px;background:' + rail(s.status) + '"></span>'
            + '<span class="sess-link__name">' + esc(s.name) + '</span>'
            + (busyAgents(s) > 1 ? '<span class="mono num" style="font-size:10px;color:var(--work)">' + busyAgents(s) + '&times;</span>' : '')
            + '</button>';
        });
        if (!p.sessions.length) {
          out += '<span class="sess-link" style="cursor:default;color:var(--ink-4);font-size:11.5px">no sessions yet</span>';
        }
      }
    });
    out += '<button class="proj" style="border:1px dashed var(--line);margin-top:6px;color:var(--ink-4)">'
      + '<span class="caretx">' + I.plus + '</span><span class="proj__name">Add a project</span></button>';
    out += '<span class="spacer"></span>'
      + '<div style="background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px">'
      + '<span class="label">This device</span>'
      + '<span style="font-size:12.5px">Laptop · Chrome</span>'
      + '<span class="mono" style="font-size:11px;color:var(--ink-4)">on your tailnet</span></div></div>';
    return out;
  }

  function deskWorkspace() {
    if (state.link === 'asleep' || state.link === 'offline') {
      return '<div class="app" style="display:flex;flex-direction:column">'
        + topbar(false) + stateScreen(false) + toast() + '</div>';
    }
    var groups = '';
    state.projects.forEach(function (p) {
      if (state.scope !== 'all' && state.scope !== p.id) { return; }
      if (!p.sessions.length && state.scope === 'all') { return; }
      var cards = '';
      p.sessions.forEach(function (s) {
        var needs = s.status === 'waiting';
        var last = s.lines[s.lines.length - 1];
        cards += '<button class="card' + (needs ? ' card--need' : '') + '" data-act="' + (needs ? 'jump' : 'open') + '" data-arg="' + s.id + '">'
          + '<div class="card__rail" style="background:' + rail(s.status) + '"></div><div class="card__body">'
          + '<div class="card__head">'
          + '<span class="card__title" style="' + (s.status === 'working' || needs ? '' : 'color:var(--ink-3)') + '">' + esc(s.name) + '</span>'
          + '<span class="spacer"></span>'
          + (busyAgents(s) > 1 ? '<span class="mono num" style="font-size:11px;color:var(--work)">' + busyAgents(s) + ' agents</span>' : '')
          + (s.queue.length ? '<span class="mono num" style="font-size:11px;color:var(--need-dim)">+' + s.queue.length + ' queued</span>' : '')
          + pill(s.status) + '<span class="card__meta">' + esc(s.elapsed) + '</span></div>'
          + '<div class="card__line"><span class="truncate">'
          + (needs ? '<span style="color:var(--need)">' + esc(s.ask.cmd) + '</span>' : esc(last.text || last.arg || ''))
          + '</span></div></div></button>';
      });
      if (!p.sessions.length) {
        cards = '<div class="empty" style="padding:22px"><span style="font-size:13px;color:var(--ink-4)">No sessions in this project yet</span></div>';
      }
      groups += '<div class="col" style="gap:9px">'
        + '<div class="group__head"><span class="dot" style="width:7px;height:7px;background:' + (p.sessions.some(function (x) { return x.status === 'waiting'; }) ? 'var(--need)' : 'var(--line-strong)') + '"></span>'
        + '<span class="group__name">' + esc(p.name) + '</span>'
        + '<span class="group__path">' + esc(p.path) + '</span>'
        + '<span class="spacer"></span>'
        + '<span class="mono num" style="font-size:11px;color:var(--ink-4)">' + p.sessions.length + ' session' + (p.sessions.length === 1 ? '' : 's') + '</span>'
        + '<button class="link-btn link-btn--quiet" data-act="newIn" data-arg="' + p.id + '">+ new session</button></div>'
        + '<div class="col" style="gap:8px">' + cards + '</div></div>';
    });

    return '<div class="app" style="display:flex;flex-direction:column">'
      + topbar(false) + banner(false)
      + '<div style="flex-grow:1;display:flex;min-height:0" class="' + (state.link === 'catching-up' ? 'stale' : '') + '">' + railHtml()
      + '<div style="flex-grow:1;min-width:0;padding:22px 24px;display:flex;flex-direction:column;gap:18px;overflow-y:auto">'
      + '<div class="row" style="align-items:flex-end;gap:14px">'
      + '<div class="col" style="gap:3px"><h1 style="font-size:26px">' + (state.scope === 'all' ? 'Everything running' : esc(projectById(state.scope).name)) + '</h1>'
      + '<span style="font-size:13px;color:var(--ink-4)">'
      + allSessions().length + ' sessions across ' + state.projects.filter(function (p) { return p.sessions.length; }).length
      + ' projects · ' + totalBusyAgents() + ' agents busy</span></div>'
      + '<span class="spacer"></span>'
      + '<button class="btn btn--md" data-act="new"' + (frozen() ? ' disabled' : '') + '>' + I.plus + ' New session</button></div>'
      + groups + '</div></div>'
      + modalHtml(false) + fullSheet(false) + toast() + '</div>';
  }

  function projectById(id) {
    var hit = state.projects[0];
    state.projects.forEach(function (p) { if (p.id === id) { hit = p; } });
    return hit;
  }

  /* ---------- session ---------- */

  function deskSession() {
    if (state.link === 'asleep' || state.link === 'offline') {
      return '<div class="app" style="display:flex;flex-direction:column">'
        + topbar(false) + stateScreen(false) + toast() + '</div>';
    }
    var r = locate(state.openId);
    var s = r.s;
    return '<div class="app" style="display:flex;flex-direction:column">'
      + topbar(false) + (state.link === 'catching-up' ? banner(false) : '')
      + '<div style="flex-grow:1;display:flex;min-height:0">' + railHtml()
      + '<div style="flex-grow:1;min-width:0;display:flex;flex-direction:column">'
      + '<div style="flex-shrink:0;padding:10px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px">'
      + '<button class="icon-btn" data-act="home" aria-label="Back to all projects">' + I.back + '</button>'
      + '<div class="col" style="gap:3px;min-width:0">'
      + '<span class="mono" style="font-size:11px;color:var(--ink-4)">'
      + '<span style="color:var(--ink-3)">' + esc(r.p.name) + '</span> / ' + esc(r.p.path)
      + ' · started ' + esc(s.startedAt) + ' from ' + esc(s.startedFrom) + '</span>'
      + '<span style="font-size:17px;font-weight:600;letter-spacing:-0.01em">' + esc(s.name) + '</span></div>'
      + '<span class="spacer"></span>'
      + pill(s.status, s.elapsed)
      + (s.status === 'working' || s.status === 'waiting'
        ? '<button class="btn btn--deny btn--sm" data-act="stop" data-arg="' + s.id + '"' + (frozen() ? ' disabled' : '') + '>' + I.stop + ' Stop</button>'
        : '<button class="btn btn--line btn--sm" data-act="retry" data-arg="' + s.id + '"' + (frozen() ? ' disabled' : '') + '>Run it again</button>')
      + '</div>'
      + tabsBar(s, false)
      + tabBody(s, false)
      + '</div></div>' + modalHtml(false) + fullSheet(false) + toast() + '</div>';
  }

  function phoneWorkspace() {
    if (state.link === 'asleep' || state.link === 'offline') {
      return '<div class="app" style="display:flex;flex-direction:column">'
        + '<div class="safe"></div>' + topbar(true) + stateScreen(true) + toast() + '</div>';
    }
    var w = waiting();
    var attention;
    if (w.length) {
      var r = w[0];
      var more = w.length > 1 ? '<span class="mono" style="font-size:10.5px;color:var(--need-dim)">+' + (w.length - 1) + ' more waiting</span>' : '';
      attention = '<button data-act="jump" data-arg="' + r.s.id + '" style="background:rgba(242,169,59,0.08);border:1px solid rgba(242,169,59,0.4);border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:10px;cursor:pointer;color:inherit;font:inherit;text-align:left;width:100%">'
        + '<div class="row" style="gap:8px;width:100%">' + I.warn
        + '<span class="label" style="color:var(--need)">Waiting on you</span><span class="spacer"></span>'
        + '<span class="mono num" style="font-size:11.5px;color:var(--need-dim)">' + esc(r.s.blockedFor || r.s.elapsed) + '</span></div>'
        + '<span class="mono" style="font-size:11.5px;color:var(--need-ink)">' + esc(r.p.name) + ' / ' + esc(r.s.name) + '</span>'
        + '<span style="font-size:15.5px;font-weight:600;color:var(--need-ink);line-height:1.35">' + esc(r.s.ask.title) + '</span>'
        + '<span class="mono truncate" style="width:100%;background:var(--term);border:1px solid var(--line-strong);border-radius:9px;padding:10px 12px;font-size:11.5px">' + esc(r.s.ask.cmd) + '</span>'
        + '<span class="btn" style="height:48px;border-radius:10px;width:100%;font-size:15px">Read it and decide</span>'
        + more + '</button>';
    } else {
      attention = '<div style="background:rgba(79,191,135,0.07);border:1px solid rgba(79,191,135,0.3);border-radius:14px;padding:15px;display:flex;align-items:center;gap:11px">'
        + I.check + '<span class="col" style="gap:3px"><span style="font-size:15px;font-weight:600;color:#8FD9B4">Nothing is waiting on you</span>'
        + '<span class="mono" style="font-size:11px;color:#6E9C82">' + countStatus('working') + ' sessions · ' + totalBusyAgents() + ' agents running</span></span></div>';
    }
    var groups = '';
    state.projects.forEach(function (p) {
      if (!p.sessions.length) { return; }
      var cards = '';
      p.sessions.forEach(function (s) {
        cards += '<button class="card" data-act="' + (s.status === 'waiting' ? 'jump' : 'open') + '" data-arg="' + s.id + '" style="border-radius:11px">'
          + '<div class="card__rail" style="background:' + rail(s.status) + '"></div>'
          + '<div class="card__body" style="padding:12px 13px;gap:6px">'
          + '<div class="row" style="gap:8px"><span style="font-size:14px;font-weight:500;color:' + (s.status === 'working' || s.status === 'waiting' ? 'var(--ink)' : 'var(--ink-3)') + '" class="truncate">' + esc(s.name) + '</span>'
          + '<span class="spacer"></span>'
          + ((s.status === 'working' || s.status === 'waiting') && !frozen() ? '<span class="dot dot--pulse" style="width:5px;height:5px;background:' + rail(s.status) + '"></span>' : '')
          + '<span class="mono num" style="font-size:10.5px;color:' + rail(s.status) + '">' + esc(s.elapsed) + '</span></div>'
          + '<div class="row" style="gap:8px">'
          + (busyAgents(s) > 1 ? '<span class="mono num" style="font-size:10.5px;color:var(--work)">' + busyAgents(s) + ' agents</span>' : '')
          + (s.queue.length ? '<span class="mono num" style="font-size:10.5px;color:var(--need-dim)">+' + s.queue.length + ' queued</span>' : '')
          + (!busyAgents(s) && !s.queue.length ? '<span class="mono truncate" style="font-size:10.5px;color:var(--ink-4)">' + esc(s.status) + '</span>' : '')
          + '</div></div></button>';
      });
      groups += '<div class="col" style="gap:7px"><div class="row" style="gap:8px">'
        + '<span class="mono" style="font-size:11.5px;color:var(--ink-3)">' + esc(p.name) + '</span>'
        + '<span class="spacer"></span>'
        + '<span class="mono num" style="font-size:10.5px;color:var(--ink-4)">' + p.sessions.length + '</span></div>'
        + '<div class="col" style="gap:7px">' + cards + '</div></div>';
    });

    return '<div class="app" style="display:flex;flex-direction:column">'
      + '<div class="safe"></div>' + topbar(true) + banner(true)
      + '<div class="' + (state.link === 'catching-up' ? 'stale' : '') + '" style="flex-grow:1;min-height:0;overflow-y:auto;padding:14px 16px 0;display:flex;flex-direction:column;gap:16px">'
      + attention + groups + '<div style="height:14px"></div></div>'
      + '<div style="flex-shrink:0;height:80px;border-top:1px solid var(--line);background:#12141A;padding:12px 16px;display:flex;align-items:center;gap:10px">'
      + '<button class="btn" style="flex-grow:1;height:52px;border-radius:12px;font-size:15px" data-act="new"' + (frozen() ? ' disabled' : '') + '>' + I.plus + ' New session</button></div>'
      + modalHtml(true) + fullSheet(true) + toast() + '</div>';
  }

  function phoneSession() {
    if (state.link === 'asleep' || state.link === 'offline') {
      return '<div class="app" style="display:flex;flex-direction:column">'
        + '<div class="safe"></div>' + topbar(true) + stateScreen(true) + toast() + '</div>';
    }
    var r = locate(state.openId);
    var s = r.s;
    return '<div class="app" style="display:flex;flex-direction:column">'
      + '<div class="safe"></div>'
      + '<div class="row" style="height:56px;flex-shrink:0;padding:0 8px;gap:6px;border-bottom:1px solid var(--line)">'
      + '<button class="icon-btn icon-btn--plain" data-act="home" aria-label="Back to all projects">' + I.back + '</button>'
      + '<div class="col" style="gap:1px;min-width:0">'
      + '<span class="mono truncate" style="font-size:10px;color:var(--ink-4)">' + esc(r.p.name) + ' · from ' + esc(s.startedFrom) + '</span>'
      + '<span class="truncate" style="font-size:13.5px;font-weight:600">' + esc(s.name) + '</span></div>'
      + '<span class="spacer"></span>'
      + '<span class="mono num" style="font-size:10.5px;color:' + rail(s.status) + '">' + esc(s.elapsed) + '</span>'
      + (s.status === 'working' || s.status === 'waiting'
        ? '<button class="icon-btn icon-btn--danger" data-act="stop" data-arg="' + s.id + '" aria-label="Stop this session"' + (frozen() ? ' disabled' : '') + '>' + I.stop + '</button>' : '')
      + '</div>'
      + (state.link === 'catching-up' ? banner(true) : '')
      + tabsBar(s, true)
      + tabBody(s, true)
      + modalHtml(true) + fullSheet(true) + toast() + '</div>';
  }

  /* ---------- modals ---------- */

  function modalHtml(phone) {
    if (!state.modal) { return ''; }
    if (state.modal.indexOf('approveAll:') === 0) { return approveAllModal(phone); }
    if (state.modal === 'new') { return newModal(phone); }
    return '';
  }

  function newModal(phone) {
    var picks = '';
    state.projects.forEach(function (p) {
      var on = state.newProject === p.id;
      picks += '<button class="chip mono" data-act="pickProject" data-arg="' + p.id + '" aria-pressed="' + on + '" style="border-radius:8px;'
        + (on ? 'background:rgba(242,169,59,0.13);border-color:var(--need);color:var(--need)' : '') + '">' + esc(p.name) + '</button>';
    });
    var body = '<div class="col" style="gap:9px"><span class="label">Which project</span>'
      + '<div class="row" style="gap:7px;flex-wrap:wrap">' + picks + '</div>'
      + '<span class="mono" style="font-size:10.5px;color:var(--ink-4)">' + esc(projectById(state.newProject).path)
      + ' · ' + projectById(state.newProject).sessions.length + ' session(s) already open</span></div>'
      + '<div class="col" style="gap:9px"><span class="label">First prompt</span>'
      + '<div class="promptbox"><i>&gt;</i><textarea class="tinput" id="newPrompt" rows="' + (phone ? '3' : '4') + '" aria-label="First prompt for the new session" placeholder="What should Claude get on with?">' + esc(state.newPrompt) + '</textarea></div></div>';
    if (phone) {
      return '<div class="scrim" style="flex-direction:column;justify-content:flex-end">'
        + '<div class="modal" style="border-radius:20px 20px 0 0;padding:18px 20px 24px;border-left:0;border-right:0;border-bottom:0">'
        + '<div class="row" style="gap:10px"><span style="font-size:18px;font-weight:600">New session</span><span class="spacer"></span>'
        + '<button class="icon-btn" data-act="closeModal" aria-label="Close">' + I.close + '</button></div>' + body
        + '<button class="btn" style="height:52px;border-radius:12px;font-size:16px" data-act="startNew"' + (state.newPrompt.trim() ? '' : ' disabled') + '>Start it on home-mac</button></div></div>';
    }
    return '<div class="scrim" style="align-items:center;justify-content:center">'
      + '<div class="modal" style="width:600px">'
      + '<div class="row" style="gap:12px;align-items:flex-start">'
      + '<div class="col" style="gap:4px"><h2 style="font-size:20px">New session</h2>'
      + '<span style="font-size:13px;color:var(--ink-4)">A project can run as many sessions as you like, side by side.</span></div>'
      + '<span class="spacer"></span><button class="icon-btn" data-act="closeModal" aria-label="Close">' + I.close + '</button></div>' + body
      + '<span class="hr"></span>'
      + '<div class="row" style="gap:9px"><span class="ghost-btn" style="cursor:default;opacity:0.6">Ask before edits</span>'
      + '<span class="ghost-btn" style="cursor:default;opacity:0.6">Ping me when blocked</span><span class="spacer"></span>'
      + '<button class="btn btn--line btn--md" data-act="closeModal">Cancel</button>'
      + '<button class="btn btn--md" data-act="startNew"' + (state.newPrompt.trim() ? '' : ' disabled') + '>Start it</button></div></div></div>';
  }

  /* ---------- render ---------- */

  function render() {
    var vp = document.getElementById('viewport');

    /* Remember where the terminal was before the DOM is thrown away. Scrolling
       to the bottom on every render used to yank you back down mid-read the
       moment a toast expired (UC-3, UC-7). Follow the tail only when the reader
       was already at the tail. */
    var prev = document.getElementById('term');
    var keep = null;
    if (prev) {
      keep = {
        top: prev.scrollTop,
        atBottom: prev.scrollHeight - prev.scrollTop - prev.clientHeight < 40,
        id: state.openId, tab: state.tab, screen: state.screen, view: state.view
      };
    }

    var inner;
    if (state.view === 'desktop') {
      inner = state.screen === 'session' ? deskSession() : deskWorkspace();
      vp.innerHTML = '<div class="desk-frame">' + inner + '</div>';
    } else {
      inner = state.screen === 'session' ? phoneSession() : phoneWorkspace();
      vp.innerHTML = '<div class="phone-frame">' + inner + '</div>';
    }

    var segs = document.querySelectorAll('.seg button');
    for (var i = 0; i < segs.length; i++) {
      var act = segs[i].getAttribute('data-act');
      var arg = segs[i].getAttribute('data-arg');
      segs[i].setAttribute('aria-pressed', String(act === 'view' ? arg === state.view : arg === state.link));
    }

    var t = document.getElementById('term');
    if (t) {
      var sameView = keep && keep.id === state.openId && keep.tab === state.tab
        && keep.screen === state.screen && keep.view === state.view;
      if (sameView && !keep.atBottom) { t.scrollTop = keep.top; }
      else { t.scrollTop = t.scrollHeight; }
    }

    /* One-shot: consumed here so a later re-render does not steal focus back. */
    if (state.focus) {
      var box = document.getElementById('newPrompt') || document.getElementById('composer');
      state.focus = false;
      if (box && !box.disabled) {
        box.focus();
        box.selectionStart = box.selectionEnd = box.value.length;
      }
    }
  }

  function flash(msg) {
    state.toast = msg;
    render();
    setTimeout(function () { if (state.toast === msg) { state.toast = null; render(); } }, 2600);
  }

  /* ---------- actions ---------- */

  /* Data-driven so it reads correctly for any request, not just the one the
     demo happens to open on. */
  function resolve(s, kind) {
    var ask = s.ask;
    s.status = 'working';
    s.blockedFor = null;
    s.ask = null;
    s.agents[0].status = 'working';
    s.agents[0].doing = kind === 'denied' ? 'taking a different route' : ask.after;
    s.lines = s.lines.filter(function (l) { return l.k !== 'wait'; });
    if (kind === 'denied') {
      s.lines.push({ k: 'err', text: 'You denied · ' + ask.label });
      s.lines.push({ k: 'say', text: ask.onDeny });
    } else {
      s.lines.push({ k: 'ok', text: 'You approved · ' + (kind === 'all' ? 'every action this session' : ask.label) });
      s.lines.push({ k: 'tool', name: ask.tool, arg: ask.cmd, out: ask.result, ok: true });
      s.lines.push({ k: 'say', text: ask.onApprove });
    }
    s.lines.push({ k: 'stream', text: ask.next });
  }

  var ACTS = {
    view: function (a) { state.view = a; state.focus = false; render(); },
    reset: function () { var v = state.view; state = initial(); state.view = v; render(); },

    /* Prototype-only: lets a reviewer see each connection state on demand.
       In the real app this is driven by the socket, not a button. */
    link: function (a) {
      var was = state.link;
      state.link = a;
      state.modal = null;
      if (a === 'live' && was === 'catching-up') {
        // UC-9: come back and be told what you missed, once.
        var s = locate('s2').s;
        if (!s.lines.some(function (l) { return l.k === 'gap'; })) {
          s.lines.splice(s.lines.length - 1, 0, { k: 'gap', text: 'you were away 4m 12s · 2 things happened' });
        }
        flash('Caught up · nothing was lost');
        return;
      }
      render();
    },

    notify: function () {
      state.notify = !state.notify;
      flash(state.notify ? 'Alerts on · blocked and failed runs' : 'Alerts off · nothing will interrupt you');
    },

    home: function () { state.screen = 'workspace'; state.draft = ''; state.focus = false; render(); },
    scope: function (a) { state.scope = a; render(); },
    toggleProj: function (a) {
      state.expanded[a] = !state.expanded[a];
      state.scope = state.scope === a ? 'all' : a;
      render();
    },
    open: function (a) {
      state.openId = a; state.screen = 'session'; state.tab = 'terminal';
      state.draft = ''; state.focus = false; state.openFile = null;
      state.expanded[projectOf(a).id] = true;
      render();
    },
    jump: function (a) {
      state.openId = a; state.screen = 'session'; state.tab = 'waiting';
      state.draft = ''; state.focus = false; state.openFile = null;
      state.expanded[projectOf(a).id] = true;
      render();
    },
    tab: function (a) { state.tab = a; state.focus = false; render(); },
    toggleFile: function (a) { state.openFile = state.openFile === a ? null : a; render(); },
    treeGo: function (a) { state.tree = a; state.openTree = null; state.full = null; render(); },
    treeOpen: function (a) {
      state.openTree = state.openTree === a ? null : a;
      state.full = null;
      render();
    },
    openFull: function (a) { state.full = a; render(); },
    closeFull: function () { state.full = null; render(); },

    approve: function (a) { resolve(locate(a).s, 'once'); state.tab = 'terminal'; flash('Approved · Claude carried on'); },
    askApproveAll: function (a) { state.modal = 'approveAll:' + a; render(); },
    approveAll: function (a) {
      resolve(locate(a).s, 'all');
      state.modal = null; state.tab = 'terminal';
      flash('Every action pre-approved for this session');
    },
    deny: function (a) { resolve(locate(a).s, 'denied'); state.tab = 'terminal'; flash('Denied · Claude is taking another route'); },

    stop: function (a) {
      var s = locate(a).s;
      s.status = 'stopped'; s.ask = null; s.queue = [];
      s.agents.forEach(function (ag) { if (ag.status === 'working' || ag.status === 'blocked') { ag.status = 'stopped'; ag.doing = 'stopped by you'; } });
      s.lines = s.lines.filter(function (l) { return l.k !== 'wait' && l.k !== 'stream'; });
      s.lines.push({ k: 'err', text: 'You stopped this run · queue cleared' });
      state.tab = 'terminal';
      flash('Stopped · every agent in this session too');
    },
    retry: function (a) {
      var s = locate(a).s;
      s.status = 'working'; s.elapsed = '2s';
      /* A new run gets new workers: leaving the old subagents on screen as
         "stopped by you" beside a session claiming to work was a lie (P6). */
      s.agents = s.agents.filter(function (ag) { return !ag.sub; });
      s.agents[0].status = 'working';
      s.agents[0].elapsed = '2s';
      s.agents[0].doing = 'picking up where it stopped';
      s.lines.push({ k: 'prompt', text: 'Try that again.' });
      s.lines.push({ k: 'stream', text: 'Picking up where it stopped' });
      state.tab = 'terminal';
      flash('Running again on home-mac');
    },

    send: function () {
      var text = state.draft.trim();
      if (!text || frozen()) { return; }
      var s = openS();
      state.draft = '';
      state.focus = true;
      if (s.status === 'working' || s.status === 'waiting') {
        s.queue.push(text);
        flash('Added to the queue · ' + s.queue.length + ' waiting');
      } else {
        s.status = 'working';
        s.agents[0].status = 'working';
        s.agents[0].doing = 'starting on your prompt';
        s.lines.push({ k: 'prompt', text: text });
        s.lines.push({ k: 'stream', text: 'Reading the project' });
        flash('Running now');
      }
    },
    unqueue: function (a) {
      var s = openS();
      s.queue.splice(parseInt(a, 10), 1);
      flash('Removed from the queue');
    },

    'new': function () { state.modal = 'new'; state.newPrompt = ''; state.focus = true; render(); },
    newIn: function (a) { state.modal = 'new'; state.newProject = a; state.newPrompt = ''; state.focus = true; render(); },
    closeModal: function () { state.modal = null; state.newPrompt = ''; state.focus = false; render(); },
    pickProject: function (a) { state.newProject = a; render(); },
    startNew: function () {
      var text = state.newPrompt.trim();
      if (!text) { return; }
      var p = projectById(state.newProject);
      var id = 's' + state.nextId;
      state.nextId += 1;
      p.sessions.unshift({
        id: id,
        name: text.length > 40 ? text.slice(0, 40) + '…' : text,
        status: 'working', elapsed: '3s',
        startedAt: 'just now', startedFrom: state.view === 'phone' ? 'your phone' : 'this browser',
        ask: null, queue: [],
        agents: [ { name: 'main', sub: false, status: 'working', elapsed: '3s', doing: 'getting its bearings in ' + p.name } ],
        files: [],
        lines: [ { k: 'prompt', text: text }, { k: 'stream', text: 'Reading ' + p.path } ]
      });
      state.modal = null; state.newPrompt = '';
      state.openId = id; state.screen = 'session'; state.tab = 'terminal';
      state.expanded[p.id] = true;
      state.focus = false;
      flash('Started in ' + p.name);
    }
  };

  /* ---------- wiring ---------- */

  document.addEventListener('click', function (ev) {
    if (ev.target.classList && ev.target.classList.contains('scrim')) { ACTS.closeModal(); return; }
    var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!el || el.disabled) { return; }
    var act = el.getAttribute('data-act');
    if (!ACTS[act]) { return; }
    ev.preventDefault();
    ACTS[act](el.getAttribute('data-arg'));
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'composer') {
      state.draft = t.value;
      var b = document.getElementById('sendBtn');
      if (b) { b.disabled = !t.value.trim() || frozen(); }
    } else if (t.id === 'newPrompt') {
      state.newPrompt = t.value;
      var sb = document.querySelector('[data-act="startNew"]');
      if (sb) { sb.disabled = !t.value.trim(); }
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.target.id === 'composer' && ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); ACTS.send(); return; }
    if (ev.target.id === 'newPrompt' && ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); ACTS.startNew(); return; }
    if (ev.key === 'Escape' && state.modal) { ACTS.closeModal(); }
  });

  render();
})();
</script>
